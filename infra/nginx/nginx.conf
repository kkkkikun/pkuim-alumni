# =============================================================================
# NMG-PKU-Alumni —— 主反向代理（容器 nmg-nginx）
#
#   /            → admin-web   （Vue3 管理后台静态产物）
#   /api/        → api         （NestJS，保留原始 URI /api/v1/...）
#   /healthz     → api         （存活探针）
#   /api/v1/system/health → api （业务健康探针，直通不重写）
#
# 挂载：./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
# 日志：访问/错误日志均输出到 stdout/stderr（容器日志采集）
# =============================================================================

user  nginx;
worker_processes  auto;
error_log  /dev/stderr  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- 日志：JSON 行格式，直接写 stdout/stderr -------------------------
    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr","remote_user":"$remote_user",'
      '"method":"$request_method","uri":"$request_uri","status":$status,'
      '"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
      '"upstream_time":"$upstream_response_time","upstream_status":"$upstream_status",'
      '"referer":"$http_referer","user_agent":"$http_user_agent",'
      '"request_id":"$request_id"}';

    access_log  /dev/stdout  json_combined  buffer=16k  flush=5s;

    # ---- 基础参数 ---------------------------------------------------------
    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    server_tokens     off;
    types_hash_max_size 4096;

    # 上传：证明材料 / 活动封面，限制 50MB
    client_max_body_size 50m;
    client_body_buffer_size 256k;
    client_body_timeout   60s;
    client_header_timeout 30s;
    send_timeout         60s;

    # ---- gzip ------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-javascript
        image/svg+xml;

    # ---- 上游 ------------------------------------------------------------
    upstream api_backend {
        server api:3000 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    upstream admin_web_backend {
        server admin-web:80 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ---- 限流（粗粒度防护；应用层已有登录失败限流，见 top.md §4.2）--------
    # 阈值刻意放宽：压测（k6 500 VU）不得被 nginx 误伤。
    # 如需收紧，直接调整 rate/burst；彻底关闭则注释掉各 location 的 limit_req。
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=1000r/s;
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=200r/s;
    limit_req_status 429;

    # ---- 主服务 ----------------------------------------------------------
    server {
        listen      80 default_server;
        server_name _;

        # ---- 安全响应头 -------------------------------------------------
        # 与应用层（apps/api/src/common/middleware/security-headers.ts）**同一份清单**。
        # 两层都要有：API 端口在 compose 里映射到 127.0.0.1:18081，**可以绕过 nginx 直连**，
        # 那时应用层自己下发的这组头是唯一的一道防线。
        #
        # ⚠️ 下面这组 proxy_hide_header 是为了**消除重复头**：
        #    应用层已经下发了同名响应头，nginx 若再 add_header 一次，
        #    客户端会收到两个同名头（例如两个 X-Frame-Options）——
        #    浏览器对重复头的行为是「可能整个忽略」，反而比不设更弱。
        #    所以这里先藏掉上游的同名头，再由 nginx 统一下发。
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Permitted-Cross-Domain-Policies;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header X-XSS-Protection;
        # ⚠️ CSP **不隐藏**：多个 CSP 响应头会被浏览器**合并**（取最严），
        #    不会造成「同名头重复被忽略」的问题。
        #    管理后台自己那份 CSP（放行了 TDesign 图标字体 CDN）因此仍然生效。

        add_header X-Content-Type-Options    "nosniff"                    always;
        add_header X-Frame-Options           "DENY"                       always;
        add_header Referrer-Policy           "no-referrer"                always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none"              always;
        add_header Cross-Origin-Opener-Policy "same-origin"               always;
        # CSP：API 返回的是 JSON，不加载任何资源，因此只声明三条硬约束。
        # 刻意不写 default-src —— 同一个进程还托管着 Swagger UI（/docs），
        # 写死 default-src 'none' 会把文档页打死。
        add_header Content-Security-Policy   "frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
        # X-XSS-Protection 已被主流浏览器废弃（且 1; mode=block 本身有风险），
        # 真正的 XSS 防线是上面的 CSP —— 这里显式关闭这个过时特性。
        add_header X-XSS-Protection          "0"                          always;
        # HSTS：只有走 HTTPS 时浏览器才会采纳；当前链路还是明文 HTTP，
        # 证书签发属人工安排，此处先按「上线即生效」准备好。
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Server                    "nginx"                      always;

        # ---- 存活探针：供 healthcheck.sh / 负载均衡使用 --------------------
        location = /healthz {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
            proxy_connect_timeout 3s;
            proxy_read_timeout    5s;
        }

        # ---- 业务健康探针：不被限流 ---------------------------------------
        location = /api/v1/system/health {
            limit_req zone=api_zone burst=100 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout    10s;
        }

        # ---- 登录：更严格的限流 -------------------------------------------
        location = /api/v1/auth/login {
            limit_req zone=login_zone burst=400 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    15s;
        }

        # ---- API 主路由：保留 /api/v1/... 原样转发 ------------------------
        location /api/ {
            limit_req zone=api_zone burst=2000 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            proxy_buffering       on;
            proxy_buffer_size     16k;
            proxy_buffers         8 16k;
            proxy_busy_buffers_size 32k;
        }

        # ---- 管理后台静态资源 ---------------------------------------------
        location / {
            proxy_pass http://admin_web_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }
}
