# =============================================================================
# NMG-PKU-Alumni —— 管理后台静态站点（容器 nmg-admin-web）
# 由 admin-web.Dockerfile 烘焙进镜像：/etc/nginx/conf.d/default.conf
# =============================================================================

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    client_max_body_size 20m;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # ---- 安全响应头 -------------------------------------------------
    # 与外层 nginx（infra/nginx/nginx.conf）与应用层
    # （apps/api/src/common/middleware/security-headers.ts）保持同一份清单。
    # 本容器也会被直接访问（compose 里映射到 127.0.0.1:18082），所以自己也要有一份。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "no-referrer" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # SPA 只加载自身资源：脚本/样式/图片都限定在同源。
    # 样式允许 'unsafe-inline' —— Vue 的 <style scoped> 会被编译进 CSS 文件，
    # 但组件里的行内 style 属性需要它。
    #
    # ⚠️ 显式放行 TDesign 的图标字体 CDN（`https://tdesign.gtimg.com`）：
    #    tdesign-vue-next 的图标组件会在**运行时**去这个地址取图标字体脚本
    #    （实测构建产物 `dist/assets/tdesign-*.js` 里确实带着这个地址）。
    #    不放行的话，管理后台的图标会整片加载不出来。
    #    除此之外不放行任何第三方来源。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://tdesign.gtimg.com; style-src 'self' 'unsafe-inline' https://tdesign.gtimg.com; img-src 'self' data: blob: https://tdesign.gtimg.com; font-src 'self' data: https://tdesign.gtimg.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-XSS-Protection "0" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 容器自身健康探针（compose healthcheck 使用）
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"admin-web"}';
    }

    # 指纹化静态资源长缓存
    #
    # ⚠️ nginx 的 `add_header` **不跨层级继承**：只要当前层级出现**任何**一条
    #    add_header，父层（server 块）的那一整组就不再继承。
    #    此前这里只有一条 `add_header Cache-Control`，
    #    于是 /assets/*.js 这类响应**一个安全响应头都没有** ——
    #    直连管理后台静态资源（compose 把它映射到 127.0.0.1:18082）时完全裸奔。
    #    现在把同一组安全头在本层**重复一遍**（nginx 没有变量化的 add_header，
    #    只能重复；改清单时两处必须一起改）。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY"    always;
        add_header Referrer-Policy        "no-referrer" always;
        add_header Permissions-Policy     "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://tdesign.gtimg.com; style-src 'self' 'unsafe-inline' https://tdesign.gtimg.com; img-src 'self' data: blob: https://tdesign.gtimg.com; font-src 'self' data: https://tdesign.gtimg.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-XSS-Protection "0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
