return `<section><div class="hero"><div class="hero-text"><div class="hero-kicker">心系燕园 · 情连北疆</div><h1 class="hero-title">内蒙古北京大学<br>校友会</h1><div class="hero-sub">同窗情谊 · 携手同行</div></div>${bannerArt()}</div><div class="home-content"><div class="home-tabs"><button data-home-tab="news" class="${tab==='news'?'on':''}">校友资讯</button><button data-home-tab="events" class="${tab==='events'?'on':''}">校友活动</button><button data-home-tab="notices" class="${tab==='notices'?'on':''}">通知公告</button></div><div class="small-note"><span class="small-dot"></span>概念展示 · 以下内容为演示信息</div><button class="article-spot" style="width:100%;text-align:left" data-show="spot"><div class="text"><div class="tag">${spot.tag}</div><h3>${spot.title}</h3><p>${spot.desc}</p></div>${miniArt()}</button><!-- 首页快捷入口与公告浮窗已移除（2026-11-19 界面反馈）：
     · 四个图标入口（校友通讯录 / 校友连接 / 校友活动 / 校友会介绍）与顶部
       tab（校友资讯 / 校友活动 / 通知公告）及底部导航功能重复；
     · 「公告」浮窗与下方「更多公告」重复。 --><!-- 首页写死的「近期活动」推荐区已移除（2026-11-22）：

const filteredPeople=()=>people.filter(p=>{let q=state.directoryQuery.trim();let ok=!q||[p.name,p.city,p.location||'',p.year,p.college,p.industry,p.direction].some(x=>x.includes(q));return ok&&(state.city==='全部地区'||p.city===state.city)&&(state.sector==='全部行业'||p.industry===state.sector)});

const sectors=['全部','数字科技','能源产业','农牧食品','法律金融','教育科研','企业管理'];
const allPosts=()=>[...state.posts,...defaultPosts];
const renderConnect=()=>{let shown=allPosts().filter(p=>(state.connectCity==='全部地区'||p.city===state.connectCity)&&(state.connectSector==='全部'||p.sector===state.connectSector));return `<section><div class="link-hero"><div class="net-art">${netArt()}</div><div><div class="link-kicker">从认识校友，到彼此成就</div><h3>让每一份专长<br>遇见新的可能</h3><p>交流行业经验，分享资源需求，<br>在信任与自愿的基础上建立连接。</p><div class="link-actions"><button class="link-action primary" data-publish="需求">${I('plus',18)}我有需求</button><button class="link-action ghost" data-publish="资源">${I('heart',18)}我能提供</button></div></div></div><div class="link-body"><div class="connect-toolbar"><button class="filter-button ${state.connectCity!=='全部地区'?'active':''}" data-action="connect-city-filter">${I('pin',14)}地区：${state.connectCity} ${I('down',14)}</button><span class="connect-result-count">找到 ${shown.length} 条连接信息</span></div><div class="link-section-title"><h3>按行业方向查看</h3><small>资源与需求双向连接</small></div><div class="sector-scroll hscroll">${sectors.map(t=>`<button class="${t===state.connectSector?'on':''}" data-sector="${t}">${t}</button>`).join('')}</div>${shown.length?shown.map(p=>`<button class="opportunity" data-post="${safe(p.id)}"><div class="op-top"><span class="type-tag ${p.type==='资源'?'offer':''}">${p.type==='资源'?'我能提供':'我有需求'}</span><span class="category">${safe(p.sector)}</span></div><h4>${safe(p.title)}</h4><p>${safe(p.desc)}</p><div class="op-foot"><span>${safe(p.city||'内蒙古')} · ${safe(p.author)}</span><span>了解详情 ${I('right',13)}</span></div></button>`).join(''):`<div class="empty-small">当前地区和行业下暂时没有连接信息<br>可以切换地区，或发布一条资源与需求。</div>`}<div class="flow-card"><h4>一次连接，是怎样发生的？</h4><div class="flow-step">${[['search','发现方向'],['message','提交意向'],['shield','双向确认'],['handshake','建立联系']].map((e,i)=>`${i?`<span class="flow-arrow">${I('right',13)}</span>`:''}<div class="step-unit"><div class="step-bubble">${I(e[0],17)}</div><span>${e[1]}</span></div>`).join('')}</div></div><p style="font-size:10.5px;color:#b5a8a1;line-height:1.8;text-align:center;padding:18px 5px">展示内容为虚构示例 · 正式运营需建立管理员审核机制</p></div></section>`;};
const renderMe=()=>{return `<section><div class="me-banner">${meArt()}<div class="me-user"><div class="me-avatar">${state.demoLogin?'校':'燕'}</div><div class="me-copy">${state.demoLogin?`<h3 class="logged-name">演示校友</h3><p>已进入模拟体验状态<br>未进行真实身份认证</p>`:`<h3>你好，校友</h3><button class="login-btn" data-action="login">点击登录</button><p style="margin-top:6px">模拟体验 · 无需真实微信授权</p>`}</div></div></div><div class="me-body"><div class="me-stats"><button data-action="my-events"><strong>${state.booked.length}</strong><span>我的活动</span></button><button data-action="my-requests"><strong>${state.requests.length}</strong><span>连接申请</span></button><button data-action="my-posts"><strong>${state.posts.length}</strong><span>我的发布</span></button></div><div class="menu-title">校友服务</div>${[['card','我的校友名片','card'],['calendar','我的活动报名','my-events'],['connect','我的连接记录','my-requests'],['file','我发布的资源与需求','my-posts']].map(e=>`<button class="menu-row" data-action="${e[2]}"><span class="menu-icon">${I(e[0],20)}</span><span>${e[1]}</span><span class="arrow-faint">${I('right',16)}</span></button>`).join('')}<div class="menu-title">账号与组织</div>${[['lock','隐私与授权','privacy'],['building','关于内蒙古校友会','about'],['settings','演示状态设置','demo-settings']].map(e=>`<button class="menu-row" data-action="${e[2]}"><span class="menu-icon">${I(e[0],20)}</span><span>${e[1]}</span><span class="arrow-faint">${I('right',16)}</span></button>`).join('')}<div class="me-footer">内蒙古北京大学校友会 · 概念原型<br>演示操作仅保存在当前浏览器</div></div></section>`;};
const render=()=>{top();drawNav();$('#scroll').innerHTML=state.page==='home'?renderHome():state.page==='directory'?renderDirectory():state.page==='connect'?renderConnect():renderMe();};
function changePage(p){if(!navs.some(x=>x.page===p))return;state.page=p;render();$('#scroll').scrollTop=0;}
let toastTimer;function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2400)}
function sheet(title,inner){$('#layer').innerHTML=`<div class="shade" data-close-backdrop><div class="sheet" role="dialog" aria-modal="true" aria-label="${safe(title)}" ><div class="grip"></div><div class="sheet-header"><h3>${safe(title)}</h3><button class="close-btn" aria-label="关闭" data-close>${I('close',18)}</button></div>${inner}</div></div>`;}
function close(){ $('#layer').innerHTML=''; }
function personSheet(id){let p=people.find(x=>x.id===id);if(!p)return;sheet('校友名片',`<div class="detail-avatar"><span class="avatar ${p.tone}">${p.name[0]}</span><div><h4>${p.name} <span class="tiny-label">演示资料</span></h4><p>${p.year} · ${p.location?`${p.location}（区外校友）`:p.city}</p></div></div><div class="detail-rows"><div class="detail-row"><label>毕业院系</label><span>${p.college}</span></div><div class="detail-row"><label>所在行业</label><span>${p.industry}</span></div><div class="detail-row"><label>专业方向</label><span>${p.direction}</span></div><div class="detail-row"><label>交流意向</label><span>${p.desc}</span></div></div><p class="sheet-info">人物为虚构示例。正式平台中仅展示校友授权内容，不公开手机号、微信号等私人联系方式。</p><button class="button-main" data-request="${p.id}">${I('send',15)} &nbsp;申请建立联系</button>`)}
function eventSheet(id){let e=demoEvents.find(x=>x.id===id);if(!e)return;let booked=state.booked.includes(id);sheet('校友活动',`<div class="sheet-badge">${I('calendar',15)} ${e.status} · 示例活动</div><h3 style="font:700 22px/1.5 var(--serif);margin:15px 0">${e.title}</h3><div class="detail-rows"><div class="detail-row"><label>活动形式</label><span>${e.kind}</span></div><div class="detail-row"><label>地点</label><span>${e.place}</span></div><div class="detail-row"><label>活动时间</label><span>待确定</span></div><div class="detail-row"><label>活动介绍</label><span>${e.details}</span></div></div><p class="sheet-info">此活动为产品演示设定，不代表校友会已正式安排活动或开放报名。</p><button class="button-main" data-book="${e.id}">${booked?'已登记体验':'模拟报名意向'}</button>`)}
function requestSheet(id){let p=people.find(x=>x.id===id);if(!p)return;sheet('申请联系校友',`<p class="sheet-sub">向 ${p.name} 提交一段简短的交流说明。正式版本需由对方自主决定是否接受联系申请。</p><form id="request-form" data-id="${id}"><div class="field"><label class="sheet-label" for="request-message">想交流什么？</label><textarea id="request-message" required maxlength="300" minlength="6" placeholder="例如：我也在从事数字科技工作，想和你交流行业经验……"></textarea></div><p class="sheet-info">模拟申请不会实际发送，也不会暴露对方的联系方式。</p><button type="submit" class="button-main">提交演示申请</button></form>`)}
function postSheet(id){let p=allPosts().find(x=>x.id===id);if(!p)return;sheet('合作详情',`<div class="sheet-badge">${p.type==='需求'?'我有需求':'我能提供'} · ${safe(p.sector)}</div><h3 style="font-size:20px;line-height:1.5;margin:16px 0">${safe(p.title)}</h3><div class="detail-rows"><div class="detail-row"><label>发布身份</label><span>${safe(p.author)}</span></div><div class="detail-row"><label>所属盟市</label><span>${safe(p.city||'未填写')}</span></div><div class="detail-row"><label>内容说明</label><span>${safe(p.desc)}</span></div></div><p class="sheet-info">正式平台中，合作联系采用意向申请与双方确认的方式，不默认公开校友联系方式。</p><button class="button-main" data-post-request="${safe(p.id)}">${I('send',16)} &nbsp;表达连接意向</button>`)}
function postRequestSheet(id){let p=allPosts().find(x=>x.id===id);if(!p)return;sheet('表达合作意向',`<p class="sheet-sub">针对「${safe(p.title)}」提交你的交流意向。</p><form id="post-request-form" data-id="${safe(id)}"><div class="field"><label class="sheet-label" for="post-message">留言内容</label><textarea id="post-message" required minlength="6" maxlength="300" placeholder="请简单说明你希望交流的内容或能够提供的资源……"></textarea></div><p class="sheet-info">原型不会实际发送消息；真实服务需要校友会审核及对方同意。</p><button type="submit" class="button-main">提交模拟意向</button></form>`)}
function publishSheet(type){sheet('发布'+(type==='需求'?'合作需求':'校友资源'),`<p class="sheet-sub">描述你希望获得的帮助，或者能够分享的专业资源。资源与需求可以双向连接。</p><form id="publish-form"><input name="kind" type="hidden" value="${type}"><div class="field"><label class="sheet-label" for="pub-city">所属盟市</label><select id="pub-city" name="city" required><option value="">请选择所属盟市</option>${regions.map(r=>`<option value="${r}">${r}</option>`).join('')}<option value="区外校友">区外校友（区外合作伙伴）</option></select></div><div class="field"><label class="sheet-label" for="pub-sector">所属领域</label><select id="pub-sector" name="sector" required><option value="">请选择领域</option>${sectors.filter(x=>x!=='全部').map(s=>`<option value="${s}">${s}</option>`).join('')}</select></div><div class="field"><label class="sheet-label" for="pub-title">简短标题</label><input id="pub-title" name="title" minlength="5" maxlength="42" required placeholder="例如：寻求技术交流或行业合作"></div><div class="field"><label class="sheet-label" for="pub-desc">详细说明</label><textarea id="pub-desc" name="description" required minlength="10" maxlength="400" placeholder="说明合作目标、需求背景或能够提供的资源……"></textarea></div><p class="sheet-info">发布时需选择所属盟市，方便其他校友按地区查找。此处仅模拟发布，信息只存储在当前浏览器。</p><button type="submit" class="button-main">发布演示信息</button></form>`)}
function selectSheet(kind){
const isRegion=kind==='city'||kind==='connect-city';
if(isRegion){const items=kind==='city'?people:allPosts();const current=kind==='city'?state.city:state.connectCity;const unit=kind==='city'?'位校友':'条信息';sheet('选择所在地区',`<p class="sheet-sub">${kind==='city'?'选择地区后，通讯录只显示该地区的校友。':'选择地区后，只显示该地区发布的资源与合作需求。'}也可以选择“全部地区”查看全部范围。</p>${renderRegionPicker(kind,current,items,unit)}<p class="region-picker-note">地区筛选只影响当前栏目，不会改变首页或其他栏目的内容。</p>`);return;}
const values=['全部行业',...new Set(people.map(p=>p.industry))];const current=state.sector;sheet('按行业方向筛选',`<p class="sheet-sub">选择行业后将在通讯录中筛选演示校友。</p><div class="pill-select">${values.map(x=>`<button class="${x===current?'on':''}" data-choose="${kind}" data-value="${x}">${x}</button>`).join('')}</div><button class="button-soft" data-close style="margin-top:23px">取消</button>`);
}
function genericSheet(kind){switch(kind){

case'spot':case'news1':case'news2':sheet('校友资讯',`<div class="sheet-badge">校友动态 · 示例文章</div><h3 style="font:700 22px/1.5 var(--serif);margin:14px 0">燕园情深，北疆同行</h3><p class="sheet-sub">小程序将作为校友活动、公告和互助资源的集中入口；用户可从微信公众号菜单快捷进入，以此了解地方校友会动态，并按自愿原则参与交流。</p><div class="sheet-info">演示文章未引用或伪造真实校友会活动消息。</div>`);break;
case'login':sheet('模拟校友登录',`<p class="sheet-sub">正式微信小程序可接入微信登录，并配套真实校友身份认证。当前网页版不会调用微信接口。</p><div class="sheet-info">点击下方按钮，只会将本地演示状态改为“已进入体验”。这不是有效的校友认证。</div><button class="button-main" data-action="finish-login">进入演示校友状态</button>`);break;
case'card':sheet('我的校友名片',`<div class="detail-avatar"><span class="avatar">燕</span><div><h4>${state.demoLogin?'演示校友':'尚未登录'}</h4><p>身份资料 · 尚未认证</p></div></div><div class="detail-rows"><div class="detail-row"><label>姓名</label><span>${state.demoLogin?'演示校友':'未填写'}</span></div><div class="detail-row"><label>毕业院系</label><span>待校友本人填写</span></div><div class="detail-row"><label>行业方向</label><span>待校友本人填写</span></div><div class="detail-row"><label>公开状态</label><span>${state.visible?'演示可见':'默认不公开'}</span></div></div><p class="sheet-info">正式产品应先完成校友身份认证，再由校友自主填写、公开或隐藏资料。</p><button class="button-soft" data-action="privacy">设置隐私与授权</button>`);break;
case'my-events':sheet('我的活动',`${state.booked.length?state.booked.map(id=>{let e=demoEvents.find(x=>x.id===id);return e?`<button class="opportunity" data-event="${id}"><h4>${e.title}</h4><p>已提交模拟意向 · 活动并未真实开放报名</p></button>`:''}).join(''):'<div class="empty-small">尚无活动记录<br>可在首页选择活动并体验报名流程</div>'}<button class="button-soft" data-nav="home">返回首页</button>`);break;
case'my-requests':sheet('连接申请记录',`${state.requests.length?state.requests.map(r=>`<div class="opportunity"><h4>${safe(r.target)}</h4><p>${safe(r.message)}</p><div class="op-foot"><span>演示申请</span><span>未实际发送</span></div></div>`).join(''):'<div class="empty-small">尚无连接申请<br>可从通讯录或连接栏目发起申请</div>'}`);break;
case'my-posts':sheet('我的发布',`${state.posts.length?state.posts.map(p=>`<button class="opportunity" data-post="${safe(p.id)}"><span class="type-tag ${p.type==='资源'?'offer':''}">${p.type}</span><h4>${safe(p.title)}</h4><p>${safe(p.desc)}</p></button>`).join(''):'<div class="empty-small">尚无演示发布内容<br>可在连接栏目发布资源或需求</div>'}<button class="button-soft" data-nav="connect">前往连接栏目</button>`);break;
case'privacy':privacySheet();break;
case'demo-settings':sheet('演示状态设置',`<p class="sheet-sub">这些设置仅影响当前浏览器里的演示状态。</p><div class="detail-rows"><div class="detail-row"><label>模拟登录</label><span>${state.demoLogin?'已进入体验':'未登录'}</span></div><div class="detail-row"><label>本地记录</label><span>${state.booked.length} 条活动 · ${state.requests.length} 条连接申请 · ${state.posts.length} 条发布</span></div></div><button class="button-soft" data-action="reset-demo">清空所有演示记录</button>`);break;
}}
function privacySheet(){sheet('隐私与授权',`<p class="sheet-sub">校友通讯录属于敏感的个人信息使用场景。应坚持本人授权、最小公开、随时可调整。</p><div class="toggle-row"><span style="flex:1"><strong>公开我的校友名片</strong><p>关闭时其他校友不可在通讯录找到你的个人资料</p></span><button class="toggle ${state.visible?'on':''}" data-toggle="visible" aria-label="切换名片公开状态" aria-pressed="${state.visible}"></button></div><div class="toggle-row"><span style="flex:1"><strong>允许收到连接申请</strong><p>允许他人通过平台发起联系申请，不直接公开联系方式</p></span><button class="toggle ${state.allowContact?'on':''}" data-toggle="allowContact" aria-label="切换连接申请状态" aria-pressed="${state.allowContact}"></button></div><p class="sheet-info">该设置为界面演示，不产生真实的法律授权记录。正式版本需要独立设计隐私政策、校友身份审核与授权撤回机制。</p>`)}
function handleAction(a){if(a==='city-filter')return selectSheet('city');if(a==='connect-city-filter')return selectSheet('connect-city');if(a==='sector-filter')return selectSheet('sector');if(a==='reset-filters'){state.city='全部地区';state.sector='全部行业';state.directoryQuery='';render();return}if(a==='finish-login'){state.demoLogin=true;save();close();render();toast('已进入演示校友状态');return}if(a==='reset-demo'){state.demoLogin=false;state.booked=[];state.requests=[];state.posts=[];state.visible=false;state.allowContact=true;save();close();render();toast('已清空本地演示记录');return}genericSheet(a)}
document.addEventListener('click',e=>{const t=e.target;
const run=(selector,fn)=>{let n=t.closest(selector);if(n){fn(n);return true}return false};
if(run('[data-close]',()=>close()))return;
if(t.matches('[data-close-backdrop]')){close();return;}
if(run('[data-nav]',n=>{close();changePage(n.dataset.nav)}))return;
if(run('[data-home-tab]',n=>{state.homeTab=n.dataset.homeTab;if(state.page!=='home')state.page='home';render();if(n.closest('.section-heading'))$('#scroll').scrollTop=0;}))return;
if(run('[data-person]',n=>personSheet(n.dataset.person)))return;
if(run('[data-event]',n=>eventSheet(n.dataset.event)))return;
if(run('[data-request]',n=>requestSheet(n.dataset.request)))return;
if(run('[data-post]',n=>postSheet(n.dataset.post)))return;
if(run('[data-post-request]',n=>postRequestSheet(n.dataset.postRequest)))return;
if(run('[data-publish]',n=>publishSheet(n.dataset.publish)))return;
if(run('[data-choose]',n=>{const kind=n.dataset.choose;if(kind==='city')state.city=n.dataset.value;else if(kind==='connect-city')state.connectCity=n.dataset.value;else state.sector=n.dataset.value;close();render();$('#scroll').scrollTop=0}))return;
if(run('[data-sector]',n=>{state.connectSector=n.dataset.sector;render()}))return;
if(run('[data-toggle]',n=>{let k=n.dataset.toggle;state[k]=!state[k];save();privacySheet();toast('设置已在本地更新')}))return;
if(run('[data-book]',n=>{let id=n.dataset.book;close();if(!state.booked.includes(id)){state.booked.push(id);save();toast('已记录模拟报名意向')}else{toast('这项演示活动已登记过')}}))return;
if(run('[data-clear-search]',()=>{state.directoryQuery='';render();$('#dir-search')?.focus()}))return;
if(run('[data-action]',n=>handleAction(n.dataset.action)))return;
});
document.addEventListener('input',e=>{if(e.target?.id==='dir-search'){state.directoryQuery=e.target.value;const next=document.createElement('template');next.innerHTML=renderDirectory();const count=$('.roster-count');const list=$('.roster-list');if(count&&list){count.replaceWith(next.content.querySelector('.roster-count'));list.replaceWith(next.content.querySelector('.roster-list'));}}});
document.addEventListener('submit',e=>{
if(e.target.id==='request-form'){e.preventDefault();let msg=$('#request-message').value.trim();if(msg.length<6){toast('请填写至少六个字的交流说明');return}let p=people.find(x=>x.id===e.target.dataset.id);state.requests.push({target:p?.name||'演示校友',message:msg});save();close();toast('模拟连接申请已记录');return}
if(e.target.id==='post-request-form'){e.preventDefault();let msg=$('#post-message').value.trim();if(msg.length<6){toast('请说明想交流的内容');return}let p=allPosts().find(x=>x.id===e.target.dataset.id);state.requests.push({target:p?.title||'演示合作方向',message:msg});save();close();toast('已记录模拟合作意向');return}
if(e.target.id==='publish-form'){e.preventDefault();let data=new FormData(e.target);let title=String(data.get('title')||'').trim();let desc=String(data.get('description')||'').trim();let sector=String(data.get('sector')||'');let city=String(data.get('city')||'');if(title.length<5||desc.length<10||!sector||!city){toast('请补充所属盟市及完整内容');return}state.posts.unshift({id:'own'+Date.now(),type:String(data.get('kind')),sector,title,desc,author:'演示校友',city});save();close();state.page='connect';state.connectCity=city;state.connectSector='全部';render();$('#scroll').scrollTop=0;toast('已在本地添加一条演示信息');return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#layer').children.length)close()});
render();
})();
</script>
</body>
</html>
