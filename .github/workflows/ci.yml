# CI：电脑端与管理台之外，这套门禁给 pkuim-alumni 的 api / worker / admin-web / 小程序
# 一条可重复的判定线。
#
# 为什么现在才有：仓库原先没有任何 CI，super agent 的 PR 只能靠人看。
# 门禁补上之后，agent 的 auto-merge 才有意义 —— 「CI 绿了才允许进主干」
# 由 GitHub 的分支保护强制执行，不靠 agent 自觉。
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 集成测试会 TRUNCATE 业务表，所以必须连测试库：
    # apps/api/test/setup.ts 的护栏会检查生效库名里含 "test"，不含就直接抛错。
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: nmg_alumni_test
          MYSQL_USER: nmg
          MYSQL_PASSWORD: ci_app_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      NODE_ENV: test
      DATABASE_URL: mysql://nmg:ci_app_password@127.0.0.1:3306/nmg_alumni_test
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: nmg_alumni_test
      DB_USER: nmg
      DB_PASSWORD: ci_app_password
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      # 对象存储：上传链路的集成用例要真的写对象存储
      # （上传令牌 → 落字节 → 回写大小、直传 → 登记 → 取下载地址、公开资产可下载）。
      MINIO_ENDPOINT: 127.0.0.1
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ci_minio
      MINIO_SECRET_KEY: ci_minio_password_0123456789
      MINIO_BUCKET_PUBLIC: nmg-public
      MINIO_BUCKET_PRIVATE: nmg-private
      # 集成测试里限流关掉（test/setup.ts 里也会兜底关一次），
      # 否则单个窗口内的大量登录会触发 429 把断言打乱。
      RATE_LIMIT_ENABLED: "false"
      AUTH_MODE: both
      JWT_SECRET: ci-only-never-production-0123456789abcdef
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 1d
      DB_LOGGING: "false"

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # pnpm 11.7.0 要求 Node >= 22.13，22.12 会被它直接拒绝启动。
          node-version: '22.21'

      # pnpm 用 npm 直接装，不用 corepack：
      #   1) corepack 自带的是 npm registry 签名公钥ring，会随 npm 轮换而过期，
      #      过期后 `corepack prepare` 直接报 "Cannot find matching keyid" 装不上；
      #   2) corepack 的 shim 跟着 node 版本走，跟 setup-node 的顺序耦合。
      # 先 corepack disable 是为了避免 shim 盖住 npm 装出来的真 pnpm。
      - name: Set up pnpm
        run: |
          corepack disable
          npm install --global pnpm@11.7.0
          pnpm --version

      - name: Cache the pnpm store
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # 小程序单测（第二轮补上的 runner）。
      #
      # 为什么单独一步而不是并进 pnpm test：
      #   `pnpm test` 在根目录是 `pnpm -r test`，会连着跑 api 的**集成测试**
      #   （需要 MySQL / Redis / 对象存储，且会 TRUNCATE 业务表），
      #   放在对象存储起来之前会红。小程序单测是纯 Node 环境、不碰数据库，
      #   单独一步既跑得快，也不会被集成测试的前置条件绑住。
      #
      # 为什么不用 `pnpm --filter @nmg/miniprogram test` 之外的方式：
      #   小程序包**没有自己的 jest 依赖**（加依赖会动 lockfile），
      #   它的 test 脚本复用 api 包里已装好的 jest —— 与 jest.config.js 的注释一致。
      - name: Miniprogram unit tests
        run: pnpm --filter @nmg/miniprogram test

      # 管理后台单元测试（第三轮新增的 runner）。
      #
      # 与小程序一样**复用 api 包里已装好的 jest**（不引入新依赖，锁文件不变）——
      # 管理后台包是 ESM（package.json 里 "type": "module"），
      # 所以它的 jest 配置用 `.cjs` 后缀。
      - name: Admin web unit tests
        run: pnpm --filter @nmg/admin-web test

      # 集成测试不会自动建表（生产约定 synchronize: false / migrationsRun: false），
      # 所以先跑一遍迁移，把表结构铺到测试库上。
      # 对象存储用 rustfs（MinIO 协议兼容的 S3 实现）。
      # 为什么不是 minio/minio：当前环境里 Docker Hub 的 minio/minio 已无法匿名拉取
      # （quay.io 源返回 401 UNAUTHORIZED），而 rustfs 可正常拉取，
      # 并已实测通过 App 真正用到的那套 S3 操作：建桶 / 写对象 / 读对象 / 预签名 URL。
      # 桶由应用启动时 bucketExists + makeBucket 幂等创建，不需要预置。
      - name: Start object storage
        run: |
          set -euo pipefail
          docker run -d --name ci-s3 -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY="$MINIO_ACCESS_KEY" \
            -e RUSTFS_SECRET_KEY="$MINIO_SECRET_KEY" \
            -e RUSTFS_CONSOLE_ENABLE=false \
            -e RUSTFS_VOLUMES=/data \
            rustfs/rustfs:latest
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "对象存储已就绪"
              exit 0
            fi
            sleep 2
          done
          echo "对象存储启动超时"
          docker logs ci-s3
          exit 1

      - name: Apply migrations to the test database
        run: pnpm --filter @nmg/api db:migrate

      # 再灌一次 seed：集成测试的「固定基座」——字典表（regions / industries）、
      # RBAC（roles / permissions / role_permissions）与管理员账号——由 seed 灌入，
      # helpers.ts 把它们列为 PRESERVED_TABLES（用例之间不清空，只清业务表）。
      # 只跑迁移不跑 seed 的话字典表是空的，用例插入带 region_code 的档案就会撞外键
      # （fk_alumni_profiles_region），整条集成链会红成一片。
      - name: Seed the test database
        run: pnpm --filter @nmg/api db:seed

      - name: Integration tests
        run: pnpm --filter @nmg/api test:integration

      # 第十轮：唯一键的**库内实况**对账。
      #
      # 为什么必须进门禁：
      #   生产库 `synchronize: false`，真正约束数据的是**迁移**，
      #   而静态对账（`check-error-semantics.mjs` 的 R5）只能证明
      #   「迁移里**写了**创建那道唯一索引」——
      #   证明不了「**这个库里真的有**那道索引」。
      #   这一层的失败是**静默**的：撞键不报错 → 数据库直接写出重复行。
      #
      # ⚠️ 只读：全程只查 information_schema，不建索引、不跑迁移、不写数据。
      #   反向验证（selftest）在**临时副本**里注入缺陷，不碰数据库。
      - name: Unique key reconciliation against the test database
        run: |
          set -euo pipefail
          node infra/scripts/check-unique-index-db.mjs
          bash infra/scripts/check-unique-index-db-selftest.sh

      # 第十四轮：「实体 ↔ 迁移」三层对账的**库内实况**（索引 / 外键 / 列定义）。
      #
      # 为什么必须进门禁：
      #   静态对账（`check-error-semantics.mjs` 的 R7 / R8 / R9）能证明
      #   「迁移里**写了**创建那道索引 / 外键 / 列」——
      #   但证明不了「**这个库里真的有**」。
      #   生产库 `synchronize: false`，跑的是迁移；迁移没被应用过、
      #   库是从旧备份恢复的、有人手工 DROP 过索引 —— 静态脚本一律看不见。
      #   这一层的失败是**静默**的：
      #     - 索引没建 → 按该列的查询退化成全表扫（只是「慢」，没人报警）；
      #     - 外键没建 → 引用完整性不再被数据库保证；
      #     - 列定义对不上 → 超长写入被**静默截断**（数据丢失）。
      #
      # ⚠️ 只读：全程只查 information_schema，不建索引、不跑迁移、不写数据。
      #   反向验证（selftest）在**临时副本**里注入缺陷，真实数据库全程只读。
      - name: Entity schema reconciliation against the test database
        run: |
          set -euo pipefail
          node infra/scripts/check-migration-schema-db.mjs
          bash infra/scripts/check-migration-schema-db-selftest.sh

      # 第九轮：把「跨实例撤权立刻生效」接进 CI（**跨进程**那一档）。
      #
      # 为什么必须进门禁：
      #   `docs/SECURITY.md` 第 2.1.4 节承诺「多实例 + 总线可用 → 撤权延迟 0」，
      #   而仓库里此前只有「同进程两个 Nest 上下文」这一档的用例
      #   （`rbac-invalidation-bus.e2e-spec.ts`）——
      #   真跨进程（两个 API 进程 + 一个 Redis）只能靠部署环境人工核对。
      #   演练脚本 `infra/scripts/invalidation-bus-drill.mjs` 把这一档变成可重复的自证：
      #   实例 B 的缓存热起来 → 实例 A 降权 → 实例 B 必须**立刻 403**（不等 TTL）。
      #
      # ⚠️ 脚本自带**退化形态对照**：另起一个实例把总线整条关掉
      #   （`RBAC_INVALIDATION_ENABLED=false`），同样的降权之后它**仍然 200** ——
      #   没有这一档，「B 变成 403 了」也可能只是「缓存本来就没热」，演练就会假绿。
      #
      # 需要：构建产物（`pnpm build` 已跑）、测试库（迁移 + seed 已跑）、Redis（service 已起）。
      - name: Cross-process invalidation drill
        run: |
          set -euo pipefail
          ADMIN_USERNAME=admin ADMIN_PASSWORD=Admin@2026 \
            node infra/scripts/invalidation-bus-drill.mjs

      # 第七轮：把失效总线的**负向验证**接进 CI。
      #
      # ⚠️ 为什么必须进门禁：
      #   「跨实例撤权立刻生效」「Redis 挂了写操作照常成功」这两条承诺，
      #   此前只有「**人记得**临时改坏实现、手动跑一次用例」守着
      #   （脚本 `.agent/negative-verification.sh`）。
      #   于是以后有人把总线改坏了，CI **一声不吭**照样全绿放行 ——
      #   这正是缺陷 #186 / #187 的同一片土壤。
      #
      # 门禁做四件事：基线必须绿 → 三种退化形态（永不订阅 / 永不发布 / 发布时抛错）
      #   必须被**行为断言**抓到 → 退出时把实现原样还原 →
      #   变异锚点失效 / **套件没跑起来**（编译错误、beforeAll 抛错）即失败
      #   （这两条是「门禁恒过」的那道防线，另有一条元自检）。
      #
      # ⚠️ 它需要**测试库 + Redis**（就是上面那两个 service），
      #    所以放在「迁移 + seed」之后、「集成测试」之后单独一步：
      #    集成测试跑的是**干净代码**，这一步临时改坏的实现会在退出时被还原。
      - name: Invalidation bus negative verification (selftest)
        run: |
          set -euo pipefail
          bash infra/scripts/check-invalidation-bus-selftest.sh

      # 第三轮：把与**安全 / 性能 / 契约**相关的静态校验接入 CI。
      #
      # 为什么现在才接：这些校验器此前只在本机手动跑，
      # 仓库里没有任何门禁保证它们是绿的 —— 契约漂移、响应结构漂移、
      # 迁移与实体不一致，都只能靠人记得跑。
      #
      # ⚠️ 选哪些是有讲究的：
      #   - **只接不依赖外部服务**的（不需要跑着的 API / 数据库 / 浏览器）；
      #   - 依赖跑着的 API 的那批（check-contract-routes / check-client-paths /
      #     check-response-shape / check-api-spec-doc / check-spec-coverage）
      #     留待 API 起来之后再跑（见下一步）。
      # 接进 CI 之前已逐个在**干净检出**上跑过，全部为绿。
      - name: Static contract and safety checks
        run: |
          set -euo pipefail
          # 契约 ↔ 小程序类型镜像（契约改了、小程序镜像没改 → 运行期静默分叉）
          node infra/scripts/check-contract-mirror.mjs
          # 契约 / 服务端 / 枚举 / RBAC 矩阵 / 事务逃逸 / 状态码断言
          node infra/scripts/check-enum-consistency.mjs
          node infra/scripts/check-rbac-matrix.mjs
          node infra/scripts/check-transaction-escape.mjs
          node infra/scripts/check-status-code-assertions.mjs
          node infra/scripts/check-dead-error-code.mjs
          node infra/scripts/check-swagger-param-usage.mjs
          node infra/scripts/check-request-dto.mjs
          node infra/scripts/check-concurrent-upsert.mjs
          node infra/scripts/check-test-coverage.mjs
          # 管理端写操作的**失败语义**对账（第八轮新增）：
          #   唯一键冲突必须落到 409，不能把数据库异常直接抛成 500
          #   （缺陷 #190：资讯分类 slug 重复此前返回 500）。
          # 第十二轮：同一支脚本把「实体 ↔ 迁移」的对账扩到三层 ——
          #   全部索引（含非唯一 idx_*）、外键、全部列的类型/长度/可空性。
          #   生产库 synchronize:false，跑的是迁移：实体声明了而迁移没建，
          #   那道索引 / 外键 / 列在生产库上**根本不存在**（#199）。
          node infra/scripts/check-error-semantics.mjs
          # 读端点的**可见性口径**对账（第十一轮新增，第十二轮扩到已登录端点，
          # 第十三轮扩到**管理端**）：
          #   逐个公开读端点核对「不可见 → 404」（不用 403，避免泄露存在性）；
          #   第十二轮起同核**已登录端点**的「无权 → 403」与「不可见 → 404」分界；
          #   第十三轮起同核**管理端端点**的「资源不存在 → 404」
          #   （⚠️ 与 check-rbac-matrix.mjs 划清边界：那支管「端点 ↔ 权限点 → 403」，
          #   本支管「端点 ↔ 资源 → 404」，两张表不重复登记）。
          #   此前这条口径只被人工抽查过（第十轮抽查出 GET /events/:id 漏了过滤，
          #   记为 #197）—— 人工抽查必然漏：新增端点 / 改坏过滤都没有机制报警。
          node infra/scripts/check-read-visibility.mjs
          # 管理后台与小程序两端的静态一致性
          node infra/scripts/check-admin-web.mjs
          node infra/scripts/check-miniprogram.mjs
          node infra/scripts/check-miniprogram-imports.mjs
          node infra/scripts/check-miniprogram-styles.mjs
          node infra/scripts/check-miniprogram-dates.mjs
          node infra/scripts/check-miniprogram-assets.mjs
          node infra/scripts/check-miniprogram-demo-content.mjs
          # 迁移清单与目录是否一致（迁移漏提交 → 上线时才炸）
          bash infra/scripts/check-pending-migrations.sh --static-only

      # 校验器自己的**反向验证**（第四轮新增）：
      #   校验器恒过的话，这一层就形同虚设。
      #   第四轮发现响应结构校验器的「字面量联合取值校验」恒过、
      #   且第三轮改的四个端点因类型记成 `unknown` 而**从未被校验**（缺陷 #181）
      #   —— 这类问题只有反向验证能暴露，所以把它接进 CI。
      #   ⚠️ 只接**不依赖业务库 / .env.prod** 的那几个：
      #   `check-test-isolation-selftest.sh` 需要 `.env.prod` 与真实数据库，
      #   在 CI 里跑不起来（它自己的基线就过不了），故不接入。
      #
      # 第八轮新增：把**前端 / 契约 / RBAC** 这批校验器的反向验证
      #   从「只在一个合并脚本里、且要起 API」拆成**每个校验器一份**：
      #   仓库原先只有 `check-frontend-selftest.sh` 一个合并脚本覆盖这 8 个校验器，
      #   而它**没有接进 CI** —— 那 8 个校验器的反向验证从来没自动跑过。
      #   拆开之后，这一步（不需要 API）与下一步（需要 API）都能单独跑，
      #   也便于定位「是哪一个校验器失去了反向验证」。
      - name: Checker reverse verification (selftests)
        run: |
          set -euo pipefail
          bash infra/scripts/check-response-shape-selftest.sh
          bash infra/scripts/check-enum-consistency-selftest.sh
          bash infra/scripts/check-request-dto-selftest.sh
          # 第八轮：错误语义对账（唯一键冲突 → 409）
          bash infra/scripts/check-error-semantics-selftest.sh
          # 第十一轮：公开读端点的可见性口径对账（不可见 → 404）；
          # 第十二轮：同一支脚本的反向验证扩到 9 例（新增已登录端点的三类缺陷）；
          # 第十三轮：扩到 12 例（再新增管理端的三类缺陷）
          bash infra/scripts/check-read-visibility-selftest.sh
          # 第八轮：前端 / 契约 / RBAC 四个**纯静态**校验器的反向验证
          bash infra/scripts/check-rbac-matrix-selftest.sh
          bash infra/scripts/check-contract-mirror-selftest.sh
          bash infra/scripts/check-admin-web-selftest.sh
          bash infra/scripts/check-miniprogram-selftest.sh

      # 依赖**跑着的 API**的那批契约校验（第三轮）。
      #
      # 这些脚本要拿真实的 Swagger 文档与真实响应体，
      # 所以必须先起一个 API 进程（用刚建好的测试库）。
      # 脚本本身只做**只读**请求，不产生业务数据。
      - name: Start the API for contract checks
        run: |
          set -euo pipefail
          PORT=18099 NODE_ENV=test node apps/api/dist/main.js > /tmp/api-contract-checks.log 2>&1 &
          echo $! > /tmp/api-contract-checks.pid
          for attempt in $(seq 1 60); do
            # ⚠️ `healthz` 被排除在全局前缀之外（`setGlobalPrefix(API_PREFIX, { exclude: ['healthz'] })`），
            #    所以它在**根路径** `/healthz`，不是 `/api/v1/healthz`。
            if curl -sf http://127.0.0.1:18099/healthz >/dev/null; then
              echo "API 已就绪"
              exit 0
            fi
            sleep 1
          done
          echo "API 启动超时"
          cat /tmp/api-contract-checks.log
          exit 1

      - name: Contract and response-shape checks against the running API
        run: |
          set -euo pipefail
          # ⚠️ Swagger 文档挂在**根路径**（`SwaggerModule.setup('docs', app, document)`），
          #    **不在**全局前缀 `/api/v1` 之下 —— 所以是 `/docs-json` 而不是 `/api/v1/docs-json`。
          SWAGGER=http://127.0.0.1:18099/docs-json
          BASE=http://127.0.0.1:18099/api/v1

          # ⚠️ 取一个**普通校友**的令牌（第四轮新增）：
          #    响应结构校验要覆盖「用户身份」的端点（`/me/summary` 等），
          #    只带管理员令牌的话这些端点一律 401 → **直接被跳过**（等于没校验）。
          #    CI 的 AUTH_MODE=both，Mock 登录可用；种子里的压测账号
          #    `mock_k6_alumni_001`（openid）与 Mock 登录的 code 一一对应
          #    （code `k6_alumni_001` → openid `mock_k6_alumni_001`）。
          USER_TOKEN="$(
            curl -sf -X POST "$BASE/auth/mock/login" \
              -H 'Content-Type: application/json' \
              -d '{"code":"k6_alumni_001"}' \
            | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>{const p=JSON.parse(s);process.stdout.write(p?.data?.accessToken ?? "")})'
          )"
          if [ -z "$USER_TOKEN" ]; then
            echo "::error::取普通校友令牌失败 —— 用户身份的端点将全部被跳过（等于没校验）"
            exit 1
          fi
          echo "已取普通校友令牌"

          node infra/scripts/check-contract-routes.mjs --swagger "$SWAGGER"
          node infra/scripts/check-client-paths.mjs --swagger "$SWAGGER"
          node infra/scripts/check-api-spec-doc.mjs --swagger "$SWAGGER"
          node infra/scripts/check-spec-coverage.mjs --swagger "$SWAGGER"
          node infra/scripts/check-request-contract.mjs --swagger "$SWAGGER"
          # 真实响应体 vs 客户端声明的返回类型（契约与实现对不上的最后一道防线）
          node infra/scripts/check-response-shape.mjs --base "$BASE" --user-token "$USER_TOKEN"

      # 第八轮：依赖**跑着的 API**的那四个校验器的反向验证。
      #
      # 为什么放在这一步（而不是静态校验那一步）：
      #   这四个校验器要拿**服务端真实注册的路由**才能判对错，
      #   而那份路由只存在于运行中的 API 的 Swagger 文档里。
      #   仓库原先把它们和另外八个校验器一起塞进 `check-frontend-selftest.sh`，
      #   而那个合并脚本**没有接进 CI** —— 于是这批校验器的反向验证
      #   从来没有自动跑过（校验器恒过的话，这一层形同虚设）。
      #
      # ⚠️ 必须显式传 `--swagger`：默认地址上的 API 可能是**旧构建**，
      #    基线会因为「代码里新增了路由、旧 API 还没有」而不一致 ——
      #    那种不一致会**如实报出来**并让这一步失败（不会假绿）。
      - name: API-backed checker reverse verification (selftests)
        run: |
          set -euo pipefail
          SWAGGER=http://127.0.0.1:18099/docs-json
          bash infra/scripts/check-contract-routes-selftest.sh --swagger "$SWAGGER"
          bash infra/scripts/check-api-spec-doc-selftest.sh --swagger "$SWAGGER"
          bash infra/scripts/check-client-paths-selftest.sh --swagger "$SWAGGER"
          bash infra/scripts/check-spec-coverage-selftest.sh --swagger "$SWAGGER"

      - name: Stop the API used for contract checks
        if: always()
        run: |
          if [ -f /tmp/api-contract-checks.pid ]; then
            kill "$(cat /tmp/api-contract-checks.pid)" 2>/dev/null || true
          fi
