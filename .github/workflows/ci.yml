# CI：电脑端与管理台之外，这套门禁给 pkuim-alumni 的 api / worker / admin-web / 小程序
# 一条可重复的判定线。
#
# 为什么现在才有：仓库原先没有任何 CI，super agent 的 PR 只能靠人看。
# 门禁补上之后，agent 的 auto-merge 才有意义 —— 「CI 绿了才允许进主干」
# 由 GitHub 的分支保护强制执行，不靠 agent 自觉。
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 集成测试会 TRUNCATE 业务表，所以必须连测试库：
    # apps/api/test/setup.ts 的护栏会检查生效库名里含 "test"，不含就直接抛错。
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: nmg_alumni_test
          MYSQL_USER: nmg
          MYSQL_PASSWORD: ci_app_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      NODE_ENV: test
      DATABASE_URL: mysql://nmg:ci_app_password@127.0.0.1:3306/nmg_alumni_test
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: nmg_alumni_test
      DB_USER: nmg
      DB_PASSWORD: ci_app_password
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      # 对象存储：上传链路的集成用例要真的写对象存储
      # （上传令牌 → 落字节 → 回写大小、直传 → 登记 → 取下载地址、公开资产可下载）。
      MINIO_ENDPOINT: 127.0.0.1
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ci_minio
      MINIO_SECRET_KEY: ci_minio_password_0123456789
      MINIO_BUCKET_PUBLIC: nmg-public
      MINIO_BUCKET_PRIVATE: nmg-private
      # 集成测试里限流关掉（test/setup.ts 里也会兜底关一次），
      # 否则单个窗口内的大量登录会触发 429 把断言打乱。
      RATE_LIMIT_ENABLED: "false"
      AUTH_MODE: both
      JWT_SECRET: ci-only-never-production-0123456789abcdef
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 1d
      DB_LOGGING: "false"

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # pnpm 11.7.0 要求 Node >= 22.13，22.12 会被它直接拒绝启动。
          node-version: '22.21'

      # pnpm 用 npm 直接装，不用 corepack：
      #   1) corepack 自带的是 npm registry 签名公钥ring，会随 npm 轮换而过期，
      #      过期后 `corepack prepare` 直接报 "Cannot find matching keyid" 装不上；
      #   2) corepack 的 shim 跟着 node 版本走，跟 setup-node 的顺序耦合。
      # 先 corepack disable 是为了避免 shim 盖住 npm 装出来的真 pnpm。
      - name: Set up pnpm
        run: |
          corepack disable
          npm install --global pnpm@11.7.0
          pnpm --version

      - name: Cache the pnpm store
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # 集成测试不会自动建表（生产约定 synchronize: false / migrationsRun: false），
      # 所以先跑一遍迁移，把表结构铺到测试库上。
      # 对象存储用 docker 直接起，而不是 services:——
      # 官方 minio/minio 镜像的默认 CMD 不是「server /data」，services: 无法改命令，
      # 只能在步骤里显式 docker run；桶由应用启动时 makeBucket 自动创建。
      - name: Start MinIO
        run: |
          # 依次尝试两个官方源：quay.io 是 MinIO 现在的官方发布地，
          # Docker Hub 上的 minio/minio 对匿名拉取并不总是可用。
          started=0
          # 三个源依次尝试：quay.io（官方发布地）→ Docker Hub → 本项目一直在用的镜像站
          # （docker-compose.prod.yml 里的 MINIO_IMAGE 就是它，本地拉取实测可用）。
          for image in quay.io/minio/minio:latest minio/minio:latest \
            swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/minio/minio:latest; do
            if docker run -d --name ci-minio \
              -p 9000:9000 \
              -e MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
              -e MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
              "$image" server /data; then
              started=1
              break
            fi
            echo "拉取 $image 失败，换下一个源"
            docker rm -f ci-minio >/dev/null 2>&1 || true
          done
          if [ "$started" -ne 1 ]; then
            echo "MinIO 镜像拉取失败"
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO 已就绪"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO 启动超时"
          docker logs ci-minio
          exit 1

      - name: Apply migrations to the test database
        run: pnpm --filter @nmg/api db:migrate

      # 再灌一次 seed：集成测试的「固定基座」——字典表（regions / industries）、
      # RBAC（roles / permissions / role_permissions）与管理员账号——由 seed 灌入，
      # helpers.ts 把它们列为 PRESERVED_TABLES（用例之间不清空，只清业务表）。
      # 只跑迁移不跑 seed 的话字典表是空的，用例插入带 region_code 的档案就会撞外键
      # （fk_alumni_profiles_region），整条集成链会红成一片。
      - name: Seed the test database
        run: pnpm --filter @nmg/api db:seed

      - name: Integration tests
        run: pnpm --filter @nmg/api test:integration
